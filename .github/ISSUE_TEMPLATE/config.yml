# The bug form is the only way into the tracker, and questions go to Discussions
# instead, which is what keeps "does this work with my headset" out of a list
# meant for things that are broken.
#
# This file and Settings > General > Features have to agree. A contact_link
# renders as a clickable card on the "New issue" chooser whether or not its
# target resolves, so if Discussions is ever switched off again this link
# becomes a guaranteed 404 in front of whoever arrives next - and with blank
# issues off as well, there would be no way in at all. Turn both back together
# or neither.
blank_issues_enabled: false
contact_links:
  - name: Question, idea, or "does this work with ..."
    url: https://github.com/kaan7305/murmur-windows/discussions
    about: >-
      Setting something up, whether a device or application works, or a feature
      you would like. Anything Murmur got wrong belongs in the bug form.
