# Blank issues are on, and there is no contact link, because Discussions is not
# enabled on this repository yet. A contact_link renders as a clickable card on
# the "New issue" chooser whether or not its target exists, so pointing one at
# /discussions today would put a guaranteed 404 in front of the first people to
# arrive - which is worse than an issue that turns up without a log attached.
#
# Once Discussions is switched on (Settings > General > Features), restore the
# intended arrangement by setting blank_issues_enabled to false and putting this
# back:
#
# contact_links:
#   - name: Question, idea, or "does this work with ..."
#     url: https://github.com/kaan7305/murmur-windows/discussions
#     about: >-
#       Setting something up, whether a device or application works, or a
#       feature you would like. Anything Murmur got wrong belongs in the bug
#       form.
blank_issues_enabled: true
